<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Tortue Luth – AR</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0a1628; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: white;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: -webkit-fill-available;
      overflow: hidden;
    }

    .topbar {
      padding: 16px 20px 12px;
      background: rgba(0,0,0,0.6);
      flex-shrink: 0;
    }
    .topbar h1 { font-size: 17px; font-weight: 600; }
    .topbar p  { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 3px; }

    model-viewer {
      width: 100%;
      flex: 1;
      background-color: #0a1628;
      --poster-color: #0a1628;
    }

    #ar-button {
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      white-space: nowrap;
      z-index: 10;
    }

    #ar-button[hidden] { display: none; }

    .zoom-controls {
      position: absolute;
      right: 16px;
      bottom: 100px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .zoom-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: rgba(0,0,0,0.65);
      border: 0.5px solid rgba(255,255,255,0.3);
      color: white;
      font-size: 26px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .info-bar {
      display: flex;
      background: rgba(0,0,0,0.6);
      flex-shrink: 0;
    }
    .info-item {
      flex: 1;
      padding: 10px 6px;
      text-align: center;
      border-right: 0.5px solid rgba(255,255,255,0.08);
    }
    .info-item:last-child { border-right: none; }
    .info-value { font-size: 13px; font-weight: 600; color: #5DCAA5; }
    .info-label { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .loading {
      position: fixed;
      inset: 0;
      background: #0a1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 999;
      transition: opacity 0.8s;
    }
    .loading.done { opacity: 0; pointer-events: none; }
    .ring {
      width: 52px; height: 52px;
      border: 3px solid rgba(93,202,165,0.2);
      border-top-color: #5DCAA5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 14px; color: rgba(255,255,255,0.5); }

    .hint {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    .hint.hidden { opacity: 0; }
    .hint-icon { font-size: 38px; animation: pulse 2s infinite; display: block; margin-bottom: 10px; }
    .hint p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.6; }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  </style>
</head>
<body>

  <div class="loading" id="loading">
    <div class="ring"></div>
    <p>Chargement de la tortue…</p>
  </div>

  <div class="topbar">
    <h1>🐢 Tortue Luth</h1>
    <p>Dermochelys coriacea</p>
  </div>

  <model-viewer
    id="viewer"
    src="https://sayanekid21-maker.github.io/ar-experience/_adult_leatherback_sea_turtle_mac.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    auto-rotate-delay="2000"
    rotation-per-second="20deg"
    shadow-intensity="1"
    exposure="1.2"
    ar-scale="fixed"
    ar-button="#ar-button"
    style="background-color:#0a1628"
  >
    <div class="hint" id="hint">
      <span class="hint-icon">👆</span>
      <p>Glissez pour tourner<br>Pincez pour zoomer</p>
    </div>

    <button slot="ar-button" id="ar-button">
      📱 Voir en réalité augmentée
    </button>

    <div class="zoom-controls">
      <div class="zoom-btn" id="zoomIn">+</div>
      <div class="zoom-btn" id="zoomOut">−</div>
    </div>
  </model-viewer>

  <div class="info-bar">
    <div class="info-item">
      <div class="info-value">1,8 m</div>
      <div class="info-label">Longueur</div>
    </div>
    <div class="info-item">
      <div class="info-value">500 kg</div>
      <div class="info-label">Poids max.</div>
    </div>
    <div class="info-item">
      <div class="info-value">80 ans</div>
      <div class="info-label">Espérance de vie</div>
    </div>
    <div class="info-item">
      <div class="info-value">En danger</div>
      <div class="info-label">Statut UICN</div>
    </div>
  </div>

  <script>
    const viewer  = document.getElementById('viewer');
    const loading = document.getElementById('loading');
    const hint    = document.getElementById('hint');
    const zoomIn  = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    let zoom = 2;

    viewer.addEventListener('load', () => {
      loading.classList.add('done');
    });

    // Masquer le loading après 10s même si pas de load event
    setTimeout(() => loading.classList.add('done'), 10000);

    setTimeout(() => hint.classList.add('hidden'), 5000);
    viewer.addEventListener('camera-change', () => hint.classList.add('hidden'), { once: true });

    zoomIn.addEventListener('click', () => {
      zoom = Math.max(0.5, zoom - 0.4);
      viewer.cameraOrbit = `auto auto ${zoom}m`;
    });
    zoomOut.addEventListener('click', () => {
      zoom = Math.min(6, zoom + 0.4);
      viewer.cameraOrbit = `auto auto ${zoom}m`;
    });
  </script>

</body>
</html>
