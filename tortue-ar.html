<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tortue Luth – Réalité Augmentée</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a1628;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .topbar h1 { font-size: 16px; font-weight: 600; }
    .topbar p  { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

    model-viewer {
      flex: 1;
      width: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    .zoom-controls {
      position: absolute;
      right: 16px;
      bottom: 110px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 10;
    }

    .zoom-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(0,0,0,0.6);
      border: 0.5px solid rgba(255,255,255,0.25);
      color: white;
      font-size: 24px;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }

    .zoom-btn:active { background: rgba(255,255,255,0.15); }

    #ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 14px 30px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      z-index: 10;
    }

    #ar-button[hidden] { display: none; }

    .hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.5s;
    }

    .hint.hidden { opacity: 0; }

    .hint-icon {
      font-size: 36px;
      display: block;
      margin-bottom: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    .hint p { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.1); }
    }

    .info-bar {
      display: flex;
      background: rgba(0,0,0,0.5);
      flex-shrink: 0;
    }

    .info-item {
      flex: 1;
      padding: 10px 8px;
      text-align: center;
      border-right: 0.5px solid rgba(255,255,255,0.08);
    }

    .info-item:last-child { border-right: none; }
    .info-value { font-size: 14px; font-weight: 600; color: #5DCAA5; }
    .info-label { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }

    .loading {
      position: absolute;
      inset: 0;
      background: #0a1628;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 100;
      transition: opacity 0.6s;
    }

    .loading.done { opacity: 0; pointer-events: none; }

    .loader-ring {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(93,202,165,0.2);
      border-top-color: #5DCAA5;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { font-size: 13px; color: rgba(255,255,255,0.5); }
  </style>
</head>
<body>

  <div class="loading" id="loading">
    <div class="loader-ring"></div>
    <p>Chargement de la tortue…</p>
  </div>

  <div class="topbar">
    <div>
      <h1>🐢 Tortue Luth</h1>
      <p>Dermochelys coriacea</p>
    </div>
  </div>

  <model-viewer
    id="viewer"
    src="_adult_leatherback_sea_turtle_mac.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="2000"
    rotation-per-second="20deg"
    shadow-intensity="1"
    exposure="1"
    ar-scale="fixed"
    scale="1 1 1"
    min-camera-orbit="auto auto 0.5m"
    max-camera-orbit="auto auto 5m"
    ar-button="#ar-button"
  >
    <div class="hint" id="hint">
      <span class="hint-icon">👆</span>
      <p>Faites glisser pour tourner<br>Pincez pour zoomer</p>
    </div>

    <button id="ar-button" slot="ar-button">
      📱 Voir en réalité augmentée
    </button>

    <div class="zoom-controls">
      <div class="zoom-btn" id="zoomIn">+</div>
      <div class="zoom-btn" id="zoomOut">−</div>
    </div>
  </model-viewer>

  <div class="info-bar">
    <div class="info-item">
      <div class="info-value">1,8 m</div>
      <div class="info-label">Longueur</div>
    </div>
    <div class="info-item">
      <div class="info-value">500 kg</div>
      <div class="info-label">Poids max.</div>
    </div>
    <div class="info-item">
      <div class="info-value">80 ans</div>
      <div class="info-label">Espérance de vie</div>
    </div>
    <div class="info-item">
      <div class="info-value">En danger</div>
      <div class="info-label">Statut UICN</div>
    </div>
  </div>

  <script>
    const viewer  = document.getElementById('viewer');
    const loading = document.getElementById('loading');
    const hint    = document.getElementById('hint');
    const zoomIn  = document.getElementById('zoomIn');
    const zoomOut = document.getElementById('zoomOut');
    let zoom = 2;

    viewer.addEventListener('load', () => loading.classList.add('done'));

    setTimeout(() => hint.classList.add('hidden'), 4000);
    viewer.addEventListener('camera-change', () => hint.classList.add('hidden'), { once: true });

    zoomIn.addEventListener('click', () => {
      zoom = Math.max(0.5, zoom - 0.4);
      viewer.cameraOrbit = `auto auto ${zoom}m`;
    });

    zoomOut.addEventListener('click', () => {
      zoom = Math.min(5, zoom + 0.4);
      viewer.cameraOrbit = `auto auto ${zoom}m`;
    });
  </script>

</body>
</html>
